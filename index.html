<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Visor 3D interactivo de Atlas, PitBoss y SureLoc" />
    <title>Atlas · Visor 3D</title>
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"
    ></script>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f6f7;
        color: #30343a;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
      }

      .viewer-page {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        padding: clamp(12px, 2vw, 24px);
      }

      .viewer-shell {
        position: relative;
        min-height: 0;
        overflow: hidden;
        border: 1px solid rgba(28, 32, 38, 0.08);
        border-radius: 18px;
        background: #fafafa;
        box-shadow: 0 12px 40px rgba(22, 27, 34, 0.07);
      }

      model-viewer {
        width: 100%;
        height: 100%;
        min-height: 420px;
        background-color: #fafafa;
        --poster-color: #fafafa;
        --progress-bar-color: #555b64;
      }

      .reset-button {
        position: absolute;
        right: 16px;
        bottom: 16px;
        z-index: 1;
        padding: 9px 13px;
        border: 1px solid rgba(28, 32, 38, 0.16);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.88);
        color: #30343a;
        font: inherit;
        font-size: 0.78rem;
        cursor: pointer;
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        transition: background-color 160ms ease, transform 160ms ease;
      }

      .reset-button:hover { background: #fff; }
      .reset-button:active { transform: scale(0.97); }
      .reset-button:focus-visible { outline: 2px solid #30343a; outline-offset: 2px; }

      .model-selector {
        position: absolute;
        top: 16px;
        left: 12px;
        right: 12px;
        z-index: 2;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .model-selector button { position: static; }
      .model-selector [aria-pressed="true"] { background: #30343a; color: #fff; }
      .model-selector button:disabled { opacity: 0.45; cursor: not-allowed; }

      .dimension-toggle { left: 16px; right: auto; }
      .dimension-toggle[aria-pressed="true"] { background: #30343a; color: #fff; }
      .dimension-anchor { width: 0; height: 0; pointer-events: none; }
      .dimension-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .dimension-overlay[hidden] { display: none; }
      .dimension-overlay path {
        fill: none;
        stroke: #727982;
        stroke-width: 1.5;
        stroke-dasharray: 1 5;
        stroke-linecap: round;
      }
      .dimension-overlay rect { fill: #e5e5e5; }
      .dimension-overlay text { fill: #30343a; font-size: 13px; text-anchor: middle; }
      .dimension-overlay .inches { fill: #6f747c; font-size: 11px; }

      .viewer-status {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 1;
        width: min(360px, calc(100% - 40px));
        margin: 0;
        color: #6f747c;
        font-size: 0.85rem;
        line-height: 1.5;
        text-align: center;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      .viewer-status[hidden] { display: none; }
      .viewer-status.is-error { color: #a33636; }

      .instructions {
        margin: 12px 0 0;
        color: #6f747c;
        font-size: clamp(0.75rem, 2vw, 0.84rem);
        letter-spacing: 0.01em;
        text-align: center;
      }

      @media (max-width: 600px) {
        .viewer-page { padding: 8px; }
        .viewer-shell { border-radius: 13px; }
        model-viewer { min-height: 360px; }
        .reset-button { right: 12px; bottom: 12px; }
        .dimension-toggle { left: 12px; right: auto; }
      }
    </style>
  </head>
  <body>
    <main class="viewer-page">
      <section class="viewer-shell" aria-label="Visor 3D del producto Atlas">
        <div class="model-selector" role="group" aria-label="Seleccionar modelo">
          <button class="reset-button" type="button" data-model="atlas" aria-pressed="true">Atlas</button>
          <button class="reset-button" type="button" data-model="pitboss" aria-pressed="false">PitBoss</button>
          <button class="reset-button" type="button" data-model="sureloc150" aria-pressed="false">SureLoc 150</button>
          <button class="reset-button" type="button" data-model="sureloc1000" aria-pressed="false">SureLoc 1000</button>
        </div>
        <model-viewer
          id="product-viewer"
          src="./N150_web_2.glb?v=20260911"
          alt="Modelo 3D interactivo del producto Atlas"
          camera-controls
          orientation="0deg 0deg 90deg"
          touch-action="none"
          auto-rotate-delay="1500"
          rotation-per-second="8deg"
          camera-orbit="90deg 90deg 125%"
          camera-target="auto auto auto"
          field-of-view="30deg"
          min-camera-orbit="auto auto 80%"
          max-camera-orbit="auto auto 250%"
          min-field-of-view="22deg"
          max-field-of-view="45deg"
          shadow-intensity="1"
          shadow-softness="0.85"
          exposure="1"
          ar
          ar-modes="webxr scene-viewer quick-look"
          ar-scale="fixed"
          ar-placement="floor"
        ></model-viewer>
        <svg class="dimension-overlay" hidden role="img" aria-label="Medidas según plano: largo 377 mm, 14.84 pulgadas; alto 165 mm, 6.5 pulgadas; diámetro 76 mm, 3 pulgadas."></svg>
        <p id="viewer-status" class="viewer-status" role="status">Cargando modelo 3D…</p>
        <button class="reset-button dimension-toggle" type="button" aria-pressed="true" disabled>Medidas</button>
        <button class="reset-button reset-view" type="button">Restablecer vista</button>
      </section>
      <p class="instructions">Arrastra para girar · Desplaza para acercar · Medidas según plano</p>
    </main>

    <script>
      const viewer = document.querySelector("#product-viewer");
      const resetButton = document.querySelector(".reset-view");
      const dimensionToggle = document.querySelector(".dimension-toggle");
      const dimensionOverlay = document.querySelector(".dimension-overlay");
      const mobileView = matchMedia("(max-width: 600px)");
      const status = document.querySelector("#viewer-status");
      const models = {
        atlas: { name: "Atlas", src: "./N150_web_2.glb?v=20260911", orientation: "0deg 0deg 90deg", angle: "90deg" },
        sureloc1000: { name: "SureLoc 1000", src: "./SureLoc1000_WEB_3D.glb?v=2dc4296899df", orientation: "180deg 0deg 0deg", angle: "90deg" },
        sureloc150: { name: "SureLoc 150", src: "./SureLoc150_Web_3D.glb?v=cbfe9c9819c2", orientation: "0deg 0deg 0deg", angle: "90deg" },
        pitboss: { name: "PitBoss", src: "./PitBoss_150_Visor_3D.glb?v=72aff3a17e84", orientation: "0deg 90deg 0deg", angle: "0deg" },
      };
      let selectedModel = "atlas";
      const modelButtons = document.querySelectorAll("[data-model]");
      modelButtons.forEach(button => button.addEventListener("click", () => {
        if (button.dataset.model === selectedModel && !status.classList.contains("is-error")) return;
        selectedModel = button.dataset.model;
        const model = models[selectedModel];
        modelButtons.forEach(item => item.setAttribute("aria-pressed", String(item === button)));
        dimensions.length = 0;
        dimensionOverlay.replaceChildren();
        viewer.querySelectorAll(".dimension-anchor").forEach(anchor => anchor.remove());
        dimensionOverlay.setAttribute("hidden", "");
        dimensionToggle.disabled = true;
        status.hidden = false;
        status.classList.remove("is-error");
        status.textContent = "Cargando modelo 3D…";
        document.title = `${model.name} · Visor 3D`;
        viewer.alt = `Modelo 3D interactivo del producto ${model.name}`;
        document.querySelector(".viewer-shell").setAttribute("aria-label", `Visor 3D del producto ${model.name}`);
        viewer.orientation = model.orientation;
        initialView.orbit = `${model.angle} 90deg 125%`;
        initialView.target = "auto auto auto";
        viewer.src = model.src;
      }));
      const initialView = {
        orbit: "90deg 90deg 125%",
        target: "auto auto auto",
        fieldOfView: "30deg",
      };

      // Nominal values from the supplied drawing; the GLB bounds only place the guides.
      // The PitBoss outlet faces -X; orientation rotates its original Z axis upright.
      const dimensions = [];
      function addDimension(name, mm, inches, positions) {
        const slots = positions.map((position, index) => {
          const anchor = document.createElement("span");
          anchor.slot = `hotspot-${name}-${index}`;
          anchor.className = "dimension-anchor";
          anchor.dataset.position = position.join(" ");
          anchor.setAttribute("aria-hidden", "true");
          viewer.append(anchor);
          return anchor.slot;
        });
        const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
        group.innerHTML = `<path/><g><rect x="-42" y="-23" width="84" height="46" rx="6"/><text y="-3">${mm} MM</text><text class="inches" y="14">${inches} IN</text></g>`;
        dimensionOverlay.append(group);
        dimensions.push({ name, slots, group });
      }

      function drawDimensions() {
        if (!viewer.loaded || dimensionOverlay.hasAttribute("hidden")) return;
        for (const { name, slots, group } of dimensions) {
          const points = slots.map(slot => viewer.queryHotspot(slot)?.canvasPosition);
          if (points.some(point => !point)) continue;
          const [a, b, c, d] = points;
          // Hide a foreshortened dimension when its label would cover both endpoints.
          group.style.display = Math.hypot(c.x - b.x, c.y - b.y) < (name === "length" ? 90 : 25) ? "none" : "";
          group.firstElementChild.setAttribute("d", `M ${a.x} ${a.y} L ${b.x} ${b.y} L ${c.x} ${c.y} L ${d.x} ${d.y}`);
          const labelX = Math.max(44, Math.min(viewer.clientWidth - 44, (b.x + c.x) / 2));
          let labelY = (b.y + c.y) / 2;
          if (mobileView.matches && name === "height") labelY = Math.min(b.y, c.y) - 28;
          if (mobileView.matches && name === "diameter") labelY = Math.max(b.y, c.y) + 28;
          group.lastElementChild.setAttribute("transform", `translate(${labelX} ${labelY})`);
        }
      }

      dimensionToggle.addEventListener("click", () => {
        const show = dimensionToggle.getAttribute("aria-pressed") !== "true";
        dimensionToggle.setAttribute("aria-pressed", String(show));
        dimensionOverlay.toggleAttribute("hidden", !show);
        viewer.autoRotate = !show;
        if (show) resetButton.click();
        drawDimensions();
      });
      viewer.addEventListener("camera-change", () => requestAnimationFrame(drawDimensions));
      new ResizeObserver(() => requestAnimationFrame(drawDimensions)).observe(viewer);
      mobileView.addEventListener("change", () => resetButton.click());
      viewer.addEventListener("ar-status", event => {
        dimensionOverlay.toggleAttribute("hidden", event.detail.status === "session-started" || dimensionToggle.getAttribute("aria-pressed") !== "true");
        drawDimensions();
      });

      resetButton.addEventListener("click", () => {
        viewer.cameraOrbit = mobileView.matches ? `${models[selectedModel].angle} 90deg 160%` : initialView.orbit;
        viewer.cameraTarget = initialView.target;
        viewer.fieldOfView = initialView.fieldOfView;
        if (typeof viewer.resetTurntableRotation === "function") {
          viewer.resetTurntableRotation();
        }

        if (typeof viewer.jumpCameraToGoal === "function") {
          viewer.jumpCameraToGoal();
        }
      });

      viewer.addEventListener("load", () => {
        status.hidden = true;
        if (dimensions.length) return;
        const size = viewer.getDimensions();
        const center = viewer.getBoundingBoxCenter();
        if (selectedModel !== "pitboss") {
          initialView.target = `${center.x} ${center.y} ${center.z + 0.05}`;
          const bottom = center.y - size.y / 2;
          const top = center.y + size.y / 2;
          const front = center.z + size.z / 2;
          const back = center.z - size.z / 2;
          addDimension("length", selectedModel === "atlas" ? "377" : "445", selectedModel === "atlas" ? "14.84" : "17.5", [
            [0, bottom - 0.006, front], [0, bottom - 0.032, front],
            [0, bottom - 0.032, back], [0, bottom - 0.006, back],
          ]);
          addDimension("height", selectedModel === "atlas" ? "165" : "209", selectedModel === "atlas" ? "6.5" : "8.2", [
            [0, bottom, front + 0.095], [0, bottom, front + 0.12],
            [0, top, front + 0.12], [0, top, front + 0.095],
          ]);
          const axisY = selectedModel === "sureloc1000" ? 0.01817377 : 0;
          addDimension("diameter", "76", "3", [
            [0, axisY - 0.038, front + 0.006], [0, axisY - 0.038, front + 0.042],
            [0, axisY + 0.038, front + 0.042], [0, axisY + 0.038, front + 0.006],
          ]);
        } else {
          initialView.target = `${center.x - 0.05} ${center.y} ${center.z}`;
          const bottom = center.y - size.y / 2;
          const top = center.y + size.y / 2;
          const front = center.x - size.x / 2;
          const back = center.x + size.x / 2;
          const axisY = 0.02957697;
          addDimension("length", "356", "14", [
            [front, bottom - 0.006, 0], [front, bottom - 0.032, 0],
            [back, bottom - 0.032, 0], [back, bottom - 0.006, 0],
          ]);
          addDimension("height", "209", "8.2", [
            [front - 0.095, bottom, 0], [front - 0.12, bottom, 0],
            [front - 0.12, top, 0], [front - 0.095, top, 0],
          ]);
          addDimension("diameter", "76", "3.0", [
            [front - 0.006, axisY - 0.038, 0], [front - 0.042, axisY - 0.038, 0],
            [front - 0.042, axisY + 0.038, 0], [front - 0.006, axisY + 0.038, 0],
          ]);
        }
        dimensionOverlay.setAttribute("aria-label", `Medidas según plano: ${dimensionOverlay.textContent}`);
        dimensionToggle.disabled = false;
        dimensionOverlay.toggleAttribute("hidden", dimensionToggle.getAttribute("aria-pressed") !== "true");
        resetButton.click();
        requestAnimationFrame(drawDimensions);
      });

      viewer.addEventListener("error", () => {
        status.hidden = false;
        status.classList.add("is-error");
        status.textContent = window.location.protocol === "file:"
          ? "Abre esta carpeta con un servidor local (Live Server o http://localhost:8000)."
          : `No se pudo cargar ${models[selectedModel].name}. Vuelve a seleccionar el modelo para reintentar.`;
      });

      if (window.location.protocol === "file:") {
        status.classList.add("is-error");
        status.textContent = "Este visor necesita un servidor local. Usa Live Server o http://localhost:8000.";
      }
    </script>
  </body>
</html>
